name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 連続して打ったタグを取りこぼさないよう、キャンセルせず順に流す。
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  # マニフェストの署名を確かめる公開鍵（X.509 SubjectPublicKeyInfo の DER を base64）。
  # ManifestSignature.kt に埋め込んである値と同じでなければならない。
  MANIFEST_PUBLIC_KEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEbetGgdoJVFzoVcDXhtS+k3qZCJ7OvN5XOmnGfZ9Fqh14MCbW9CPcd8qVhlGy/BKZcpHeYZqPZCFmFdo05cpPbQ=="

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.compute.outputs.code }}
      name: ${{ steps.compute.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # versionCode は YYYYMMDDnn（JST の日付 + 2 桁の連番）。日付を含む形にしているのは、
      # 既に配布した 2026021901 を下回れないため。タグからの配布は 01 から始めて、配布中の版と
      # 同じ日付なら連番を進める。配布しない手動実行は 00 を使い、同じ日のタグ版と衝突させない。
      # versionName はタグ名から v を除いたもの。手動実行はコミットで識別できる名前を付ける。
      - name: Compute version
        id: compute
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%Y%m%d)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "タグは vMAJOR.MINOR.PATCH の形で打つこと（受け取った値: $GITHUB_REF_NAME）" >&2
              exit 1
            fi
            url="https://github.com/${REPOSITORY}/releases/download/latest/latest.json"
            published=$(curl -fsSL "$url" | jq -r '.android.versionCode' || true)
            case "$published" in
              ''|null) published=0 ;;
            esac
            if [ "${#published}" -eq 10 ] && [ "${published%??}" = "$today" ]; then
              code=$((published + 1))
            else
              code="${today}01"
            fi
            if [ "$code" -le "$published" ]; then
              echo "versionCode が増えていません（配布中 $published → 今回 $code）" >&2
              exit 1
            fi
          else
            code="${today}00"
            name="dev-$(git rev-parse --short HEAD)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code versionName=$name"

  # 配布物を作る前にテストを通す。ここが落ちればリリースまで進まない。
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: ${{ env.JAVA_VERSION }}

      # リポジトリに置いている gradle-wrapper.jar が公式のものであることを確かめる。
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

  # 手動実行でも組む。配布はしないが、実機で試すための署名済み APK を成果物として残す。
  android:
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # 署名鍵は secrets から復元する。同じ鍵で署名し続ける限り端末上で上書き更新できる。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 が未設定です" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          CLOUD_MARKS_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          CLOUD_MARKS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLOUD_MARKS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLOUD_MARKS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          "-Pcloudmarks.versionCode=${{ needs.version.outputs.code }}"
          "-Pcloudmarks.versionName=${{ needs.version.outputs.name }}"
          --console=plain

      # 署名鍵が効かないと APK は -unsigned の名前で出る。未署名のまま配ると端末で
      # 上書き更新できないので、署名済みだけを拾って見つからなければ落とす。
      - name: Collect APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "署名済みの APK が生成されていません" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$apk" artifacts/cloud-marks.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/cloud-marks.apk
          if-no-files-found: error

  # 配布物の照合値からマニフェストを組み、署名する。公開の権限は持たず、成果物として release へ渡す。
  # 署名鍵を持つのはこのジョブだけで、リリースを書き換える権限とは同居させない。
  manifest:
    if: github.ref_type == 'tag'
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # アプリが引く latest.json。url は人が読むための記載で、アプリは参照しない。
      - name: Write latest.json
        env:
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPOSITORY}/releases/download/latest"
          apk_sha=$(sha256sum artifacts/cloud-marks.apk | cut -d' ' -f1)
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg url "$base/cloud-marks.apk" --arg sha256 "$apk_sha" \
            '{
              android: {
                versionCode: $versionCode,
                versionName: $versionName,
                url: $url,
                sha256: $sha256
              }
            }' > artifacts/latest.json

      # latest.json の生バイトへ署名する。アプリは署名を確かめてからでないとマニフェストを解釈しない。
      # 鍵は環境変数で受け取り、権限を絞った一時ファイルへ書いて使い、ステップを抜けるときに消す。
      # 引数へ載せるとプロセス一覧から読める。
      - name: Sign latest.json
        env:
          SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "MANIFEST_SIGNING_KEY が未設定です" >&2
            exit 1
          fi
          if [ -z "$MANIFEST_PUBLIC_KEY" ]; then
            echo "MANIFEST_PUBLIC_KEY が未設定です（ワークフローの env に埋めること）" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/manifest-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          openssl dgst -sha256 -sign "$key_file" artifacts/latest.json |
            base64 -w0 > artifacts/latest.json.sig

          # アプリが持つ公開鍵で確かめてから配る。鍵が食い違ったまま公開すると、
          # 配布済みの全端末が更新できなくなる。
          printf '%s' "$MANIFEST_PUBLIC_KEY" | base64 -d > "$RUNNER_TEMP/manifest-public-key.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/manifest-public-key.der" \
            -out "$RUNNER_TEMP/manifest-public-key.pem"
          base64 -d artifacts/latest.json.sig > "$RUNNER_TEMP/latest.json.sig.der"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/manifest-public-key.pem" \
            -signature "$RUNNER_TEMP/latest.json.sig.der" artifacts/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: |
            artifacts/latest.json
            artifacts/latest.json.sig
          if-no-files-found: error

  # 成果物を公開するだけのジョブ。contents: write を持つのはここだけ。
  release:
    if: github.ref_type == 'tag'
    needs: [version, android, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 版ごとのリリース。配布物の実物が残るので、後からどの版で何を配ったかを辿れる。
      # 配布物を書き込む唯一の外部コードなので、可変タグではなくコミットで固定する。
      - name: Publish versioned release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.version.outputs.name }}
          body: |
            Cloud Marks ${{ needs.version.outputs.name }}

            配布中の版として `latest` にも同じ配布物を置いている。
            アプリの設定画面「Application Update」から確認・適用できる。
          files: |
            artifacts/cloud-marks.apk

      # 更新経路。配布済みのアプリは latest からマニフェストと配布物を引くため、
      # 置き場を動かさずに中身だけ差し替える。
      - name: Update latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            配布中の版（${{ needs.version.outputs.name }}）。
            アプリの設定画面「Application Update」から確認・適用できる。
          prerelease: true
          files: |
            artifacts/cloud-marks.apk
            artifacts/latest.json
            artifacts/latest.json.sig
